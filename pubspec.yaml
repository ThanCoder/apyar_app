name: apyar_app
description: "Apyar Text Reader App"
publish_to: "none" # Remove this line if you wish to publish to pub.dev
repository: https://github.com/ThanCoder/apyar_app

version: 4.0.0

environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  package_info_plus: ^10.2.1
  cfb_store: ^0.7.0

  dart_core_extensions:
    git:
      url: https://github.com/ThanCoder/dart_core_extensions.git
  t_widgets:
    git:
      url: https://github.com/ThanCoder/t_widgets.git
  dual_store:
    git: https://github.com/ThanCoder/dual_store
  than_pkg_linux: ^0.2.0
  than_pkg_android: ^0.6.1
  path_provider: ^2.1.6

# flutter pub upgrade dart_core_extensions t_widgets dual_store

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  # dart run change_app_package_name:main [com.new.package.name]
  flutter_launcher_icons: ^0.14.4
  # dart run flutter_launcher_icons

  # dev lib
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/logo/logo_1.jpg"

flutter:
  uses-material-design: true

  assets:
  - assets/
  - assets/logo/
