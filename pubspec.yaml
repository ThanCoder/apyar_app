name: apyar_app
description: "Apyar Text Reader App"
publish_to: "none" # Remove this line if you wish to publish to pub.dev
repository: https://github.com/ThanCoder/apyar_app

version: 3.0.0

environment:
  sdk: ^3.10.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  than_pkg: ^5.0.0
  t_widgets: ^2.6.1
  t_client: ^0.3.0
  provider: ^6.1.5+1
  file_selector: ^1.1.0
  t_html_parser: ^1.5.0
  flutter_bloc: ^9.1.1
  dart_core_extensions: ^0.3.0
  flutter_markdown_plus: ^1.0.7
  yaml: ^3.1.3
  dual_store:
    path: /home/thancoder/projects/plugins/dual_store
    # git: https://github.com/ThanCoder/dual_store

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  # dart run change_app_package_name:main [com.new.package.name]
  flutter_launcher_icons: ^0.14.4
  # dart run flutter_launcher_icons

# dev lib
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/apyar_log_1.jpg"

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - CHANGELOG.md
    - README.md
    - pubspec.yaml
    - assets/apyar.dual.db
